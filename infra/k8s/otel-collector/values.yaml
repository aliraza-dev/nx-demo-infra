replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  tag: "0.108.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "otel-collector"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  ports:
    otlp-grpc:
      port: 4317
      targetPort: 4317
      protocol: TCP
    otlp-http:
      port: 4318
      targetPort: 4318
      protocol: TCP
    metrics:
      port: 8888
      targetPort: 8888
      protocol: TCP
    prom-metrics:
      port: 8889
      targetPort: 8889
      protocol: TCP

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

config: |
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:

    resource/loki:
      attributes:
        - action: insert
          key: loki.resource.labels
          value: 'service.name'

  exporters:
    otlphttp/prometheus:
      endpoint: 'http://prometheus:9090/api/v1/otlp'
      tls:
        insecure: true

    otlp/tempo:
      endpoint: 'tempo:4317'
      tls:
        insecure: true

    otlphttp/loki:
      endpoint: 'http://loki:3100/otlp'
      tls:
        insecure: true

  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: '0.0.0.0'
                  port: 8888

    pipelines:
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/prometheus]

      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo]

      logs:
        receivers: [otlp]
        processors: [resource/loki, batch]
        exporters: [otlphttp/loki]
