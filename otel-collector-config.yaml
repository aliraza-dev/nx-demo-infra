receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  resource/loki:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: 'service.name'

exporters:
  # Metrics exporter
  otlphttp/prometheus:
    endpoint: 'http://prometheus:9090/api/v1/otlp'
    tls:
      insecure: true

  # Traces exporter pointing to Tempo container
  otlp/tempo:
    endpoint: 'tempo:4317'
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: 'http://loki:3100/otlp'
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    logs:
      receivers: [otlp]
      processors: [resource/loki, batch]
      exporters: [otlphttp/loki]
